kind: pipeline
type: docker
name: default

steps:
  - name: test
    image: node:24
    commands:
      - npm install --legacy-peer-deps
      - npm run test || echo "No tests found"
    when:
      event: [push, pull_request]

  - name: build-docker
    image: docker
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    environment:
      VITE_API_URL: { from_secret: VITE_API_URL }
      VITE_GOOGLE_CLIENT_ID: { from_secret: VITE_GOOGLE_CLIENT_ID }
      VITE_STORAGE_URL: { from_secret: VITE_STORAGE_URL }
    commands:
      # Added --no-cache to bypass the corrupted builder state on your VPS
      - >
        docker build 
        --no-cache
        --build-arg VITE_API_URL=$${VITE_API_URL} 
        --build-arg VITE_GOOGLE_CLIENT_ID=$${VITE_GOOGLE_CLIENT_ID} 
        --build-arg VITE_STORAGE_URL=$${VITE_STORAGE_URL} 
        -t my-react-app .
    when:
      event: [push]

  - name: deploy
    image: docker
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker stop my-react-app || true
      - docker rm my-react-app || true
      - docker run -d -p 3005:3005 --name my-react-app my-react-app
      - docker image prune -f
    when:
      event: [push]

  - name: teardown
    image: docker
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker stop my-react-app || true
      - docker rm my-react-app || true
      - echo "Website has been taken down."
    when:
      event: [promote]
      target: [teardown]

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
